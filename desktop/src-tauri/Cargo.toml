[package]
name = "agriprevision-desktop"
version = "0.4.1"
description = "Application de bureau autonome AgriPrévision reliée directement à son API"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"

[profile.release]
lto = "thin"
opt-level = "s"
strip = "symbols"
