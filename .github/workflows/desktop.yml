name: Compiler AgriPrévision Desktop

on:
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Vérifier les scripts de l’interface
        shell: pwsh
        run: Get-ChildItem desktop/ui/js/*.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Installer les dépendances et compiler NSIS
        working-directory: desktop
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run desktop:build
      - name: Créer et relire le paquet MSIX x64
        shell: pwsh
        run: ./desktop/package-msix.ps1
      - name: Conserver l’installateur pour téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: AgriPrevision-Desktop-Windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Conserver le paquet MSIX pour Partner Center
        uses: actions/upload-artifact@v4
        with:
          name: AgriPrev-MSIX-Store-x64
          path: desktop/src-tauri/target/release/bundle/msix/AgriPrev_*_x64.msix
          if-no-files-found: error
