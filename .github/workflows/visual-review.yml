name: Contrôle visuel temporaire

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Accueil desktop et mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Installer les dépendances et Pillow
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          python3 -m venv "$RUNNER_TEMP/visual-venv"
          "$RUNNER_TEMP/visual-venv/bin/pip" install 'Pillow==11.3.0'
      - name: Capturer l’accueil sans données privées
        env:
          VISUAL_PYTHON: ${{ runner.temp }}/visual-venv/bin/python
        run: bash scripts/visual-review-ci.sh
